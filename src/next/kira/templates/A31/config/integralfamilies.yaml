      - ["k2", 0]                                    #2  LiteRed: sp[k2,k2]
      - ["-k1-k2+q", 0]                              #3  LiteRed: sp[-k1-k2+q,-k1-k2+q]
      - {bilinear: [["k1", "l"], 0]}                 #4  LiteRed: sp[k1,l]
      - {bilinear: [["k2", "l"], 0]}                 #5  LiteRed: sp[k2,l]
      - ["l", 0]                                     #6  LiteRed: sp[l,l]
      - ["k2-q", 0]                                  #7  LiteRed: sp[k2-q,k2-q]
      - ["k1+l-q", 0]                                #8  LiteRed: sp[k1+l-q,k1+l-q]
      - {bilinear: [["k2", "-k1-k2+q"], 0]}          #9  LiteRed: sp[k2,-k1-k2+q]
