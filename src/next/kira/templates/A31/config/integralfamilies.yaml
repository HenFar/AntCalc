# A31: Kira translation of the LiteRed bases used by the legacy pipeline.
# Propagator order is the LiteRed Ds[basis] order, so j[B, a1..an] <-> B[a1,..,an].
# Kira convention: [mom, m] = mom^2 - m, {bilinear: [[a, b], m]} = a.b - m.
integralfamilies:
  - name: "A31Basis1"
    loop_momenta: [l, k1, k2]
    top_level_sectors: [511]
    cut_propagators: [1, 2, 3]
    propagators:
      - ["k1", 0]                                    #1  LiteRed: sp[k1,k1]
      - ["k2", 0]                                    #2  LiteRed: sp[k2,k2]
      - ["-k1-k2+q", 0]                              #3  LiteRed: sp[-k1-k2+q,-k1-k2+q]
      - {bilinear: [["k1", "k2"], 0]}                #4  LiteRed: sp[k1,k2]
      - ["l", 0]                                     #5  LiteRed: sp[l,l]
      - ["k1+l", 0]                                  #6  LiteRed: sp[k1+l,k1+l]
      - ["k2-l", 0]                                  #7  LiteRed: sp[k2-l,k2-l]
      - ["k1+k2+l-q", 0]                             #8  LiteRed: sp[k1+k2+l-q,k1+k2+l-q]
      - {bilinear: [["k2", "-k1-k2+q"], 0]}          #9  LiteRed: sp[k2,-k1-k2+q]
  - name: "A31Basis2"
    loop_momenta: [l, k1, k2]
