      - ["l1", 0]                                    #1  LiteRed: sp[l1,l1]
      - ["l2", 0]                                    #2  LiteRed: sp[l2,l2]
      - ["l1-q", 0]                                  #3  LiteRed: sp[l1-q,l1-q]
      - ["k1+l1-q", 0]                               #4  LiteRed: sp[k1+l1-q,k1+l1-q]
      - ["-l1+l2+q", 0]                              #5  LiteRed: sp[-l1+l2+q,-l1+l2+q]
      - ["-k1+l1+l2", 0]                             #6  LiteRed: sp[-k1+l1+l2,-k1+l1+l2]
      - ["-k1+l2", 0]                                #7  LiteRed: sp[-k1+l2,-k1+l2]
