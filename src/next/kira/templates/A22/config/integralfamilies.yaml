      - ["l1-q", 0]                                  #4  LiteRed: sp[l1-q,l1-q]
      - ["k1+l1-q", 0]                               #5  LiteRed: sp[k1+l1-q,k1+l1-q]
      - ["l1+l2-q", 0]                               #6  LiteRed: sp[l1+l2-q,l1+l2-q]
      - ["-k1+l1+l2", 0]                             #7  LiteRed: sp[-k1+l1+l2,-k1+l1+l2]
