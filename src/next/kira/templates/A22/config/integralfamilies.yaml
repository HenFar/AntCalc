      - ["l1+l2", 0]                                 #3  LiteRed: sp[l1+l2,l1+l2]
      - ["l2-q", 0]                                  #4  LiteRed: sp[l2-q,l2-q]
      - ["k1+l2-q", 0]                               #5  LiteRed: sp[k1+l2-q,k1+l2-q]
      - ["l1+q", 0]                                  #6  LiteRed: sp[l1+q,l1+q]
      - ["-k1+l1", 0]                                #7  LiteRed: sp[-k1+l1,-k1+l1]
  - name: "A22TwoLoopTreeBasis8"
    loop_momenta: [l1, l2]
