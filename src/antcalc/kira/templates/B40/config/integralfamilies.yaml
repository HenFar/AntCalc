# B40: Kira translation of the LiteRed bases used by the legacy pipeline.
# Propagator order is the LiteRed Ds[basis] order, so j[B, a1..an] <-> B[a1,..,an].
# Kira convention: [mom, m] = mom^2 - m, {bilinear: [[a, b], m]} = a.b - m.
integralfamilies:
  - name: "chainBasis1234"
    loop_momenta: [p1, p2, p3]
    top_level_sectors: [511]
    cut_propagators: [1, 2, 3, 4]
    propagators:
      - ["p1", 0]                                    #1  LiteRed: sp[p1,p1]
      - ["p2", 0]                                    #2  LiteRed: sp[p2,p2]
      - ["p3", 0]                                    #3  LiteRed: sp[p3,p3]
      - ["-p1-p2-p3+q", 0]                           #4  LiteRed: sp[-p1-p2-p3+q,-p1-p2-p3+q]
      - ["p1+p2", 0]                                 #5  LiteRed: sp[p1+p2,p1+p2]
      - ["-p1-p2+q", 0]                              #6  LiteRed: sp[-p1-p2+q,-p1-p2+q]
      - ["p2+p3", 0]                                 #7  LiteRed: sp[p2+p3,p2+p3]
      - ["p1+p2+p3", 0]                              #8  LiteRed: sp[p1+p2+p3,p1+p2+p3]
      - ["-p1+q", 0]                                 #9  LiteRed: sp[-p1+q,-p1+q]
